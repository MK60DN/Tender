[tool.pytest.ini_options]
pythonpath = ["agent_layer"]
testpaths = ["agent_layer/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["agent_layer/app"]
omit = ["*/tests/*", "*/__pycache__/*"]
