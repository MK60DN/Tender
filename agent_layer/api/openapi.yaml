openapi: 3.0.3
info:
  title: Tender Agent Layer API
  version: 0.1.0
paths:
  /health:
    get:
      summary: health check
      responses:
        "200": {description: OK}
  /daoql/events:
    post:
      summary: write a DAOQL event
      responses:
        "200": {description: stored}
  /daoql/events/{student_id}:
    get:
      summary: list events for a student
      parameters:
        - name: student_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: event list}
  /tender/state/{student_id}:
    get:
      summary: compute Tender state
      parameters:
        - name: student_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Tender state}
  /agents:
    get:
      summary: list agents
      responses:
        "200": {description: agent list}
  /agents/{agent_id}/invoke:
    post:
      summary: invoke an agent
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: agent message}
