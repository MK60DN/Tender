<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tender · 环境辅助</title>
  <link rel="stylesheet" href="/ui/ambient.css?v=1">
  <link rel="stylesheet" href="/ui/mode-switch.css?v=4">
  <script src="/ui/onboarding-gate.js?v=1"></script>
</head>
<body class="ambient-page">
<a class="skip" href="#stage">跳到主要内容</a>
<header class="topbar">
  <a class="brand" href="/ui/single.html" aria-label="Tender 单人模式"><span>T</span><b>Tender</b></a>
  <nav class="mode-switch compact" aria-label="使用模式"><a href="/ui/ambient.html" aria-current="page">环境辅助</a><a href="/ui/single.html">我的数据</a><a href="/ui/multi.html">多人数据</a></nav>
  <div class="ambient-status"><i></i><span id="connectionText">正在启动环境辅助</span></div>
</header>

<main id="stage" class="stage">
  <section class="desktop-preview" aria-label="环境辅助预览">
    <div class="mock-window one"><div class="mock-bar"></div><div class="mock-lines"></div></div>
    <div class="mock-window two"><div class="mock-bar"></div><div class="mock-lines"></div></div>
    <div class="mock-window three"><div class="mock-bar"></div><div class="mock-lines"></div></div>
    <div class="danmaku-layer" id="danmakuLayer" aria-live="polite"><div class="lane" id="lane1"></div><div class="lane" id="lane2"></div></div>
    <div class="ambient-toolbar">
      <span class="live-label"><i></i>弹幕辅助已开启</span>
      <label for="scenarioSelect">场景</label>
      <select id="scenarioSelect"><option value="score_improvement">提分冲刺</option><option value="gaokao_registration">高考报名</option></select>
      <button class="ghost" id="privacyBtn" type="button">隐私与控制</button>
      <button class="ghost" id="closeAmbientBtn" type="button">关闭环境保护</button>
    </div>
    <div class="privacy-panel" id="privacyPanel" hidden>
      <strong>界面读取由你逐次授权</strong>
      <span>桌面端点击“读界面”后，只在本机读取 15 分钟内的可见顶层窗口</span>
      <span>密码、验证码、证件号、手机号和邮箱会先隐去；原文与截图不写入 DAOQL</span>
      <span>隐藏标签页、剪贴板、键盘记录、摄像头和麦克风不会被读取</span>
      <span>用户选择的图片、音频和视频由桌面端插件本地处理，不自动上传</span>
      <button class="ghost small" id="privacyCloseBtn" type="button">收起</button>
    </div>
    <div class="taskbar">
      <div class="agent-orbits" id="agentOrbits" aria-label="当前 Agent 圆桌"><span>Agent 读取中</span></div>
      <input id="replyInput" maxlength="240" placeholder="如果需要，回一句你现在的卡点…" aria-label="回复 Tender">
      <button class="primary" id="replyBtn" type="button">回复</button>
      <button class="ghost" id="demoBtn" type="button">来一条提示</button>
      <span class="queue-note" id="queueNote"></span>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/ui/ambient.js?v=1" defer></script>
</body>
</html>
