<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tender · 建立世界坐标</title>
  <link rel="stylesheet" href="/ui/world-setup.css?v=2">
  <link rel="stylesheet" href="/ui/account-menu.css?v=2">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/ui/single.html"><span>T</span><b>Tender</b></a>
  <div class="progress" aria-label="首次使用进度"><span class="done">1 登录</span><span class="current">2 世界坐标</span><span>3 心智测评</span></div>
</header>
<main class="page">
  <section class="hero">
    <div class="kicker">OBJECTIVE WORLD · FIRST-RUN SETUP</div>
    <h1>先建立你的客观世界坐标。</h1>
    <p class="lead">年级、学科、专业和当前目标，决定 Tender 从哪里寻找知识、任务与真实结果。下一步的测评再建立你的主观入口。两者分开记录、可以修改。</p>
    <div class="why"><article><b>客观世界</b><span>你在学什么、处在哪个阶段、要完成什么。</span></article><article><b>主观世界</b><span>你通常如何注意、理解、犹豫、恢复和行动，由下一步测评生成。</span></article></div>
  </section>
  <form class="form-card" id="worldForm">
    <div class="two"><label class="field"><span>当前阶段</span><select id="stageSelect"></select></label><label class="field"><span>具体年级/阶段</span><select id="gradeSelect"></select></label></div>
    <div class="two"><label class="field"><span>学校或学习环境 <em class="hint">可选</em></span><input id="schoolInput" maxlength="120" placeholder="例如：XX中学、大学、自学、培训机构"></label><label class="field" id="majorField"><span>专业或岗位方向 <em class="hint">可选</em></span><input id="majorInput" maxlength="120" placeholder="例如：计算机科学、护理、销售管理"></label></div>
    <div class="group-title">主要学习科目或能力领域</div><p class="hint">至少选择一项。Tender 会用这些范围连接知识体系、任务和结果。</p><div class="chips" id="subjectChips"></div>
    <div class="group-title">当前最想提升的 1–3 项</div><div class="chips" id="targetChips"></div>
    <label class="field"><span>你现在的具体目标</span><textarea id="goalInput" maxlength="300" placeholder="例如：三个月内把数学从 80 分提高到 105 分；完成高考报名；通过大学专业课考试"></textarea></label>
    <label class="field"><span>学习方式</span><select id="modeSelect"><option>自主学习</option><option>学校课程</option><option>机构辅导</option><option>家庭支持</option><option>工作实践</option></select></label>
    <div class="actions"><button class="primary" id="saveBtn" type="submit">保存世界坐标，继续测评</button><a class="secondary" href="/ui/login.html">返回登录</a></div>
    <p class="status" id="status" role="status" aria-live="polite"></p><div class="preview" id="preview"></div>
  </form>
</main>
<script src="/ui/account-menu.js?v=2" defer></script>
<script src="/ui/world-setup.js?v=2" defer></script>
</body>
</html>
