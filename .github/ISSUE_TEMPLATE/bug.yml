name: Bug report
description: Report a reproducible software defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, commands and expected behavior. Do not include secrets or learner data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, personal data, local paths containing identities and tenant information.
