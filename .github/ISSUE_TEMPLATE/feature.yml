name: Feature request
description: Propose a product or research improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and assumptions
  - type: textarea
    id: boundary
    attributes:
      label: Safety, privacy and claim boundaries
